<title>Grafo RITP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Plano de obra: el grafo ocupa todo el lienzo; a la derecha (abajo en el teléfono) un panel con la ficha del nodo y los filtros. */
:root {
  --bg: #eef2f4; --panel: #ffffff; --ink: #13212b; --ink-2: #44535f; --muted: #75838f; --line: #d3dbe1;
  --chip: #e3e9ed; --halo: #ffffff; --neutral: #9fb0bd; --act: #13212b; --focus: #0b6bcb;
  --edge-h: rgba(70, 92, 110, .28); --edge-c: rgba(30, 48, 62, .42); --edge-m: #13212b; --edge-s: rgba(70, 92, 110, .35);
  --bar: #2a78d6; --nuevo: #eb6834;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1418; --panel: #141d23; --ink: #e6ecef; --ink-2: #a9b6bf; --muted: #76848e; --line: #25313a;
  --chip: #1d2830; --halo: #0d1418; --neutral: #5b6d7a; --act: #e6ecef; --focus: #5aa2f0;
  --edge-h: rgba(150, 172, 188, .22); --edge-c: rgba(200, 214, 224, .38); --edge-m: #e6ecef; --edge-s: rgba(150, 172, 188, .30);
  --bar: #3987e5; --nuevo: #d95926;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1418; --panel: #141d23; --ink: #e6ecef; --ink-2: #a9b6bf; --muted: #76848e; --line: #25313a;
  --chip: #1d2830; --halo: #0d1418; --neutral: #5b6d7a; --act: #e6ecef; --focus: #5aa2f0;
  --edge-h: rgba(150, 172, 188, .22); --edge-c: rgba(200, 214, 224, .38); --edge-m: #e6ecef; --edge-s: rgba(150, 172, 188, .30);
  --bar: #3987e5; --nuevo: #d95926;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); margin: 0; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
aside { grid-column: 2; grid-row: 2; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: .01em; }
header .sub { color: var(--ink-2); font-size: 13px; }
header .cifras { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lienzo { grid-column: 1; grid-row: 2; position: relative; min-width: 0; min-height: 0; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.sobre { cursor: pointer; }
canvas.arrastra { cursor: grabbing; }
.herr { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.herr button, .btn { font: 500 12px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.herr button:hover, .btn:hover { border-color: var(--ink-2); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.punta { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; font-size: 12px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.punta b { font-family: var(--f-mono); font-weight: 500; }
.punta span { color: var(--ink-2); display: block; }
aside { border-left: 1px solid var(--line); background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.pestanas { display: flex; border-bottom: 1px solid var(--line); }
.pestanas button { flex: 1; font: 600 13px var(--f-ui); color: var(--ink-2); background: none; border: 0; padding: 10px; cursor: pointer;
  border-bottom: 2px solid transparent; }
.pestanas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.cuerpo { overflow-y: auto; padding: 14px 16px 24px; min-height: 0; flex: 1; }
.buscar { position: relative; margin-bottom: 12px; }
.buscar input { width: 100%; box-sizing: border-box; font: 14px var(--f-ui); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.resultados { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.vacio { color: var(--muted); font-size: 13px; line-height: 1.5; }
.tipo { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-2); }
.ficha h2 { font-size: 18px; line-height: 1.3; margin: 6px 0 4px; text-wrap: balance; }
.ficha .num { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.ruta { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 4px 0 10px; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 13px; margin: 0 0 12px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; }
.texto { font-family: var(--f-text); font-size: 15px; line-height: 1.55; white-space: pre-wrap; max-height: 260px; overflow-y: auto;
  background: var(--bg); border-radius: 6px; padding: 10px 12px; margin: 0 0 14px; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 6px; }
.version { border-left: 2px solid var(--line); padding: 2px 0 6px 10px; margin-bottom: 6px; font-size: 13px; }
.version .cab { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.version p { font-family: var(--f-text); font-size: 14px; margin: 4px 0 0; color: var(--ink-2); white-space: pre-wrap; }
.etq { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
.etq.vig { background: var(--ink); color: var(--panel); }
.grupo-con summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 6px 0; list-style: none; display: flex; gap: 8px; align-items: center; }
.grupo-con summary::-webkit-details-marker { display: none; }
.grupo-con summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
.grupo-con[open] summary::before { content: "▾"; }
.grupo-con summary .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.item { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left;
  font: 13px var(--f-ui); color: var(--ink); background: none; border: 0; border-radius: 5px; padding: 5px 6px; cursor: pointer; }
.item:hover { background: var(--chip); }
.item .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .l b { font-family: var(--f-mono); font-weight: 500; margin-right: 6px; }
.marca { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 1px solid var(--halo); }
.marca.cuad { border-radius: 2px; }
.marca.romb { border-radius: 1px; transform: rotate(45deg) scale(.85); }
.nav { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; }
legend { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
.chk { display: grid; grid-template-columns: auto 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
.chk .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.linea { width: 22px; height: 0; border-top: 2px solid var(--ink-2); }
.leyenda { display: flex; flex-direction: column; gap: 2px; }
.leyenda button { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left;
  font: 13px var(--f-ui); color: var(--ink); background: none; border: 0; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.leyenda button:hover, .leyenda button[aria-pressed="true"] { background: var(--chip); }
.leyenda .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
select { width: 100%; font: 13px var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
.cifras4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 6px; }
.cifras4 div { background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.cifras4 b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cifras4 span { font-size: 12px; color: var(--ink-2); }
.indicador { margin-top: 18px; }
.indicador h3 { margin: 0 0 2px; }
.expl { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0 0 6px; }
.fila { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left;
  font: 13px var(--f-ui); color: var(--ink); background: none; border: 0; border-radius: 5px; padding: 5px 6px; cursor: pointer; }
.fila:hover { background: var(--chip); }
.fila .rk { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
.fila .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .nm b { font-family: var(--f-mono); font-weight: 500; margin-right: 6px; }
.fila .vl { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.fila .vl small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.fila .barra { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.fila .barra i { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
.fila .sub { grid-column: 2 / 4; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.version.post { opacity: .5; }
.nota { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 18px; }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 56vh auto; }
  aside { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--line); }
  .cuerpo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header .cifras { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header>
    <h1 id="titulo">Grafo RITP</h1>
    <span class="sub" id="subtitulo">Árbol de nodos versionados y actos administrativos</span>
    <span class="cifras" id="cifras"></span>
  </header>
  <div class="lienzo" id="lienzo">
    <canvas id="cv" aria-label="Grafo de nodos: haz clic en un nodo para ver su ficha y sus conexiones" role="img"></canvas>
    <div class="herr">
      <button id="b-encuadrar" type="button">Encuadrar todo</button>
      <button id="b-centrar" type="button">Centrar selección</button>
      <button id="b-etiquetas" type="button" class="btn" aria-pressed="true">Etiquetas</button>
    </div>
    <div class="punta" id="punta" hidden></div>
  </div>
  <aside>
    <div class="pestanas" role="tablist">
      <button id="t-ficha" role="tab" aria-selected="true" type="button">Nodo</button>
      <button id="t-ind" role="tab" aria-selected="false" type="button">Indicadores</button>
      <button id="t-filtros" role="tab" aria-selected="false" type="button">Filtros</button>
    </div>
    <div class="cuerpo" id="p-ficha" role="tabpanel">
      <div class="buscar">
        <input id="q" type="search" placeholder="Buscar numeral, acto o texto (p. ej. 1.8.5.1, multa)" autocomplete="off" aria-label="Buscar nodo">
        <div class="resultados" id="resultados"></div>
      </div>
      <div id="ficha" class="ficha"></div>
    </div>
    <div class="cuerpo" id="p-ind" role="tabpanel" hidden><div id="indicadores"></div></div>
    <div class="cuerpo" id="p-filtros" role="tabpanel" hidden>
      <fieldset><legend>Resaltar un acto</legend>
        <select id="f-acto" aria-label="Resaltar un acto"><option value="">Ninguno</option></select>
      </fieldset>
      <fieldset id="f-aristas"><legend>Relaciones (aristas)</legend></fieldset>
      <fieldset id="f-nodos"><legend>Tipos de nodo</legend></fieldset>
      <fieldset><legend>Capítulos de las Bases</legend><div class="leyenda" id="leyenda"></div></fieldset>
      <p class="nota" id="nota"></p>
    </div>
  </aside>
</div>

<script id="datos" type="application/json">/*__DATOS__*/null</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("datos").textContent);
const N = D.nodos, E = D.aristas, ACTOS = D.actos, CAPS = D.capitulos;
const $ = id => document.getElementById(id);

// ---------- tipos ----------
const TIPOS = {
  documento: ["Documento PDF", "cuad", 1], acto: ["Acto administrativo", "cuad", 1], fragmento: ["Fragmento de acto", "cuad", 1],
  acto_posterior: ["Acto posterior", "cuad", 1], instruccion: ["Instrucción", "cuad", 1], aclaracion: ["Aclaración", "cuad", 1],
  formalidad: ["Formalidad", "cuad", 1],
  raiz: ["Raíz", "circ", 0], portada: ["Portada", "circ", 0], parte: ["Parte", "circ", 0], capitulo: ["Capítulo", "circ", 0],
  articulo: ["Artículo", "circ", 0], inciso: ["Inciso", "circ", 0], inciso_eliminado: ["Inciso eliminado", "circ", 0],
  tabla: ["Tabla", "romb", 2], tema: ["Tema", "romb", 2], ficha: ["Ficha de actos", "romb", 2],
};
const GRUPOS_TIPO = [["Bases de Licitación", 0], ["Actos administrativos", 1], ["Otros", 2]];
const ARISTAS = {
  jerarquia: { n: "Jerarquía (padre → hijo)", sale: "Contiene", entra: "Pertenece a", w: .6, c: "--edge-h", d: [] },
  modifica: { n: "Modifica (reemplaza, agrega, elimina)", sale: "Modifica", entra: "Modificado por", w: 1.6, c: "--edge-m", d: [] },
  ubica: { n: "Ubica (aclaración o instrucción)", sale: "Ubica", entra: "Ubicado por", w: 1.1, c: "--edge-m", d: [4, 3] },
  procedencia: { n: "Procedencia (documento → acto → fragmento)", sale: "Contiene", entra: "Proviene de", w: .8, c: "--edge-c", d: [5, 4] },
  cita: { n: "Cita entre artículos de las Bases", sale: "Cita a", entra: "Citado por", w: .8, c: "--edge-c", d: [] },
  cita_acto: { n: "Cita desde un acto", sale: "Menciona", entra: "Mencionado por", w: .8, c: "--edge-c", d: [2, 3] },
  similitud: { n: "Similitud de contenido", sale: "Parecido a", entra: "Parecido a", w: .7, c: "--edge-s", d: [1, 3] },
};
const ORDEN_ARISTAS = ["similitud", "jerarquia", "procedencia", "cita_acto", "cita", "ubica", "modifica"];
const visibleTipo = Object.fromEntries(Object.keys(TIPOS).map(k => [k, true]));
const visibleArista = Object.fromEntries(Object.keys(ARISTAS).map(k => [k, k !== "similitud"]));

// ---------- adyacencia y tamaños ----------
const ady = N.map(() => []);
E.forEach((e, k) => { ady[e[0]].push(k); ady[e[1]].push(k); });
const grado = N.map((_, i) => ady[i].filter(k => E[k][2] !== "similitud").length);
const BASE = { raiz: 9, parte: 7, capitulo: 5, articulo: 2.2, inciso: 1.4, inciso_eliminado: 1.4, portada: 4, documento: 6,
  acto: 6.5, fragmento: 2, acto_posterior: 2, instruccion: 1.8, aclaracion: 2, formalidad: 1.6, tabla: 2.4, tema: 5, ficha: 4 };
const radio = N.map((n, i) => (BASE[n.k] || 2) + (["inciso", "formalidad"].includes(n.k) ? 0.15 : 0.45) * Math.sqrt(grado[i]));
const COLORES = 8;

// ---------- estado ----------
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const vista = { s: 1, x: 0, y: 0 };      // pantalla = mundo * escala * s + desplazamiento
let hastaK = ACTOS.length - 1;          // todos los actos; los indicadores se comparan con las Bases solas (k = 0)
let escala = 1, sel = -1, hover = -1, resalte = null, historia = [], etiquetas = true, capResaltado = -1;
let sucio = true;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let paleta = {};
function leerPaleta() {
  paleta = { bg: css("--bg"), ink: css("--ink"), ink2: css("--ink-2"), muted: css("--muted"), halo: css("--halo"),
    neutral: css("--neutral"), act: css("--act"), focus: css("--focus"), nuevo: css("--nuevo"), c: [1,2,3,4,5,6,7,8].map(k => css("--c" + k)) };
  for (const k in ARISTAS) paleta[k] = css(ARISTAS[k].c);
  sucio = true;
}
const colorNodo = n => n.k === "documento" || n.k === "acto" ? paleta.act :
  (n.g !== undefined && n.g < COLORES ? paleta.c[n.g] : paleta.neutral);
const forma = n => (TIPOS[n.k] || ["", "circ"])[1];

function medir() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  escala = Math.min(W, H) * 0.42;
  sucio = true;
}
const aPantalla = (x, y) => [x * escala * vista.s + vista.x, y * escala * vista.s + vista.y];
const aMundo = (px, py) => [(px - vista.x) / (escala * vista.s), (py - vista.y) / (escala * vista.s)];
const rPantalla = i => radio[i] * Math.min(3.2, Math.max(.75, Math.sqrt(vista.s)));
const existe = i => N[i].o <= hastaK && (N[i].h === undefined || N[i].h > hastaK);
const nodoVisible = i => visibleTipo[N[i].k] && existe(i);
const aristaVisible = k => visibleArista[E[k][2]] && E[k][4] <= hastaK && nodoVisible(E[k][0]) && nodoVisible(E[k][1]);

function encuadrar(indices) {
  const xs = indices.map(i => N[i].x), ys = indices.map(i => N[i].y);
  if (!xs.length) return;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const ancho = Math.max(x1 - x0, .02), alto = Math.max(y1 - y0, .02);
  vista.s = Math.min(40, Math.max(.3, Math.min((W * .78) / (ancho * escala), (H * .78) / (alto * escala))));
  vista.x = W / 2 - (x0 + x1) / 2 * escala * vista.s;
  vista.y = H / 2 - (y0 + y1) / 2 * escala * vista.s;
  sucio = true;
}
const todos = () => N.map((_, i) => i).filter(nodoVisible);

// ---------- dibujo ----------
function trazarForma(c, f, x, y, r) {
  if (f === "cuad") c.rect(x - r, y - r, 2 * r, 2 * r);
  else if (f === "romb") { c.moveTo(x, y - r * 1.25); c.lineTo(x + r * 1.25, y); c.lineTo(x, y + r * 1.25); c.lineTo(x - r * 1.25, y); c.closePath(); }
  else { c.moveTo(x + r, y); c.arc(x, y, r, 0, Math.PI * 2); }
}
function dibujar() {
  sucio = false;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = paleta.bg; ctx.fillRect(0, 0, W, H);
  const foco = resalte;                       // Set de nodos destacados (selección, acto o capítulo) o null
  const pos = N.map(n => aPantalla(n.x, n.y));
  // aristas
  for (const tipo of ORDEN_ARISTAS) {
    if (!visibleArista[tipo]) continue;
    const a = ARISTAS[tipo];
    for (const pasada of foco ? [0, 1] : [1]) {
      ctx.beginPath();
      let hay = false;
      for (let k = 0; k < E.length; k++) {
        const e = E[k];
        if (e[2] !== tipo || e[4] > hastaK || !nodoVisible(e[0]) || !nodoVisible(e[1])) continue;

    for (const i of [...s]) for (const k of ady[i]) if (["modifica", "ubica", "cita_acto", "procedencia"].includes(E[k][2]) && E[k][0] === i) s.add(E[k][1]);
    N.forEach((n, i) => { if (n.k === "documento" && n.i === ACTOS[a].d) s.add(i); });

}
let pestana = "ficha";
function mostrarPestana(p) {
  pestana = p;
  for (const [t, c] of [["ficha", "t-ficha"], ["ind", "t-ind"], ["filtros", "t-filtros"]]) {
    $(c).setAttribute("aria-selected", String(p === t)); $("p-" + t).hidden = p !== t;
  }

}
$("t-ficha").onclick = () => mostrarPestana("ficha");
$("t-filtros").onclick = () => mostrarPestana("filtros");
$("t-ind").onclick = () => mostrarPestana("ind");
$("b-encuadrar").onclick = () => encuadrar(todos());
$("b-centrar").onclick = () => centrar(sel);
$("b-etiquetas").onclick = ev => { etiquetas = !etiquetas; ev.target.setAttribute("aria-pressed", String(etiquetas)); sucio = true; };

const ULT = ACTOS.length - 1;

// ---------- indicadores (todos los actos, comparados con las Bases solas) ----------
const padreDe = new Array(N.length).fill(-1);
E.forEach(e => { if (e[2] === "jerarquia") padreDe[e[1]] = e[0]; });
const articuloDe = N.map((_, i) => { let x = i, n = 0; while (x >= 0 && N[x].k !== "articulo" && n++ < 12) x = padreDe[x]; return x >= 0 && N[x].k === "articulo" ? x : -1; });
const idxNodo = new Map(N.map((n, i) => [n.i, i]));
const nodoActo = ACTOS.map(a => idxNodo.get(a.i));
function calcular(k) {
  const vivo = i => N[i].o <= k && (N[i].h === undefined || N[i].h > k);
  const arts = N.map((n, i) => i).filter(i => N[i].k === "articulo" && vivo(i));
  const citas = new Map(), citasActo = new Map(), desdeCaps = new Map(), desdeActos = new Map(), totalCap = new Map();
  const red = new Map();                    // red de artículos y actos para la centralidad
  const unir = (a, b) => { if (a < 0 || b < 0 || a === b) return; for (const [x, y] of [[a, b], [b, a]]) { if (!red.has(x)) red.set(x, new Map()); red.get(x).set(y, (red.get(x).get(y) || 0) + 1); } };
  const actoMods = ACTOS.map(() => ({ caps: new Set(), mods: 0, menc: 0, ubica: 0 }));
  const capMods = new Map(), artsMod = new Set();
  for (const e of E) {
    if (e[4] > k || !vivo(e[0]) || !vivo(e[1])) continue;
    const [s, t, tipo] = e;
    if (tipo === "cita") {
      citas.set(t, (citas.get(t) || 0) + 1); unir(s, t);
      const gs = N[s].g, gt = N[t].g;
      if (gt !== undefined) { totalCap.set(gt, (totalCap.get(gt) || 0) + 1); if (gs !== undefined && gs !== gt) { if (!desdeCaps.has(gt)) desdeCaps.set(gt, new Set()); desdeCaps.get(gt).add(gs); } }
    } else if (tipo === "cita_acto" || tipo === "modifica" || tipo === "ubica") {
      const a = N[s].a !== undefined ? N[s].a : (N[s].k === "acto" ? ACTOS.findIndex(x => x.i === N[s].i) : -1);
      if (a < 0) continue;
      const art = tipo === "cita_acto" ? t : articuloDe[t];
      unir(nodoActo[a], art);
      const g = N[t].g;
      if (a > 0 && g !== undefined) actoMods[a].caps.add(g);
      if (tipo === "cita_acto") {
        citasActo.set(t, (citasActo.get(t) || 0) + 1);
        if (g !== undefined) { totalCap.set(g, (totalCap.get(g) || 0) + 1); if (!desdeActos.has(g)) desdeActos.set(g, new Set()); desdeActos.get(g).add(a); }
        actoMods[a].menc++;
      } else if (tipo === "modifica") {
        actoMods[a].mods++;
        if (a > 0) { if (g !== undefined) capMods.set(g, (capMods.get(g) || 0) + 1); if (art >= 0) artsMod.add(art); }
      } else actoMods[a].ubica++;
    }
  }
  N.forEach((n, i) => { if (vivo(i) && n.o > 0 && n.o <= k && n.g !== undefined && ["acto_posterior", "instruccion", "aclaracion", "tabla"].includes(n.k)) actoMods[n.o].caps.add(n.g); });
  // centralidad: cercanía (Wasserman-Faust) y PageRank sobre la red de artículos y actos
  const vs = [...red.keys()], n = vs.length;
  const cerca = new Map(), pr = new Map();
  for (const v of vs) {
    const dist = new Map([[v, 0]]), cola = [v];
    for (let q = 0; q < cola.length; q++) for (const w of red.get(cola[q]).keys()) if (!dist.has(w)) { dist.set(w, dist.get(cola[q]) + 1); cola.push(w); }
    let suma = 0; dist.forEach(d => { suma += d; });
    const r = dist.size - 1;
    cerca.set(v, suma > 0 && n > 1 ? (r / suma) * (r / (n - 1)) : 0);

  vs.forEach(v => pr.set(v, 1 / Math.max(n, 1)));
  const gradoW = new Map(vs.map(v => [v, [...red.get(v).values()].reduce((a, b) => a + b, 0)]));
  for (let it = 0; it < 40; it++) {

    for (const v of vs) for (const [w, c] of red.get(v)) nuevo.set(w, nuevo.get(w) + .85 * pr.get(v) * c / gradoW.get(v));
    nuevo.forEach((x, v) => pr.set(v, x));

  const rankPR = new Map([...pr.entries()].sort((a, b) => b[1] - a[1]).map(([v], r) => [v, r + 1]));
  const temas = N.map((n, i) => i).filter(i => N[i].k === "tema" && vivo(i)).map(i => {
    const hijos = E.filter(e => e[2] === "jerarquia" && e[0] === i && e[4] <= k && vivo(e[1])).map(e => e[1]);
    return { i, v: hijos.length, actos: new Set(hijos.map(h => N[h].a).filter(a => a !== undefined)).size };
  });
  return { k, arts, citas, citasActo, desdeCaps, desdeActos, totalCap, actoMods, capMods, artsMod, cerca, pr, rankPR, temas,
    nodos: N.reduce((a, _, i) => a + (vivo(i) ? 1 : 0), 0), rel: E.reduce((a, e) => a + (e[4] <= k && vivo(e[0]) && vivo(e[1]) ? 1 : 0), 0) };
}
let base = null;
const nfmt = (x, d = 0) => x.toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
const delta = (x, b) => { if (b === undefined || hastaK === 0) return ""; const d = x - b; return d ? `<small>(${d > 0 ? "+" : ""}${nfmt(d)})</small>` : ""; };
function tarjeta(titulo, expl, filas) {
  if (!filas.length) return `<section class="indicador"><h3>${titulo}</h3><p class="expl">${expl}</p><p class="vacio">Sin datos con los actos elegidos.</p></section>`;
  const max = Math.max(...filas.map(f => f.v), 1e-9);
  return `<section class="indicador"><h3>${titulo}</h3><p class="expl">${expl}</p>` + filas.map((f, r) => `<button class="fila" type="button" data-i="${f.i}">
    <span class="rk">${r + 1}</span><span class="nm">${f.nom}</span><span class="vl">${f.txt ?? nfmt(f.v)}${f.d || ""}</span>
    <span class="barra"><i style="width:${Math.max(2, 100 * f.v / max)}%"></i></span>${f.sub ? `<span class="sub">${f.sub}</span>` : ""}</button>`).join("") + `</section>`;
}
const nomNodo = i => `<b>${esc(N[i].l)}</b>${esc(N[i].t === N[i].l ? "" : N[i].t.replace(N[i].l, "").trim())}`;
function indicadores() {
  if (!base) base = calcular(0);
  const c = calcular(hastaK), b = base;
  const capIdx = g => idxNodo.get(CAPS[g].i);
  let h = `<div class="cifras4">
    <div><b>${nfmt(c.nodos)}</b><span>nodos ${delta(c.nodos, b.nodos)}</span></div>
    <div><b>${nfmt(c.rel)}</b><span>relaciones ${delta(c.rel, b.rel)}</span></div>
    <div><b>${nfmt(c.artsMod.size)}</b><span>artículos modificados por actos</span></div>
    <div><b>${hastaK + 1}</b><span>de ${ACTOS.length} actos incluidos</span></div></div>
    <p class="expl">Con todos los actos. Entre paréntesis, el cambio respecto de las Bases solas. Cada fila lleva al nodo en el grafo.</p>`;
  const tot = i => (c.citas.get(i) || 0) + (c.citasActo.get(i) || 0);
  h += tarjeta("Artículos más citados", "Cuántas veces lo mencionan otros artículos de las Bases y los fragmentos de los actos.",
    c.arts.filter(i => tot(i) > 0).sort((x, y) => tot(y) - tot(x)).slice(0, 15).map(i => ({ i, v: tot(i), nom: nomNodo(i),
      d: delta(tot(i), (b.citas.get(i) || 0) + (b.citasActo.get(i) || 0)),
      sub: `${c.citas.get(i) || 0} desde artículos · ${c.citasActo.get(i) || 0} desde actos` })));
  const amplitud = g => (c.desdeCaps.get(g)?.size || 0) + (c.desdeActos.get(g)?.size || 0);
  h += tarjeta("Capítulos citados desde más partes", "Cuántos capítulos y actos distintos lo citan: mide qué tan transversal es un capítulo, no solo cuántas citas recibe.",
    CAPS.map((_, g) => g).filter(g => amplitud(g) > 0).sort((x, y) => amplitud(y) - amplitud(x) || (c.totalCap.get(y) || 0) - (c.totalCap.get(x) || 0)).slice(0, 15)
      .map(g => ({ i: capIdx(g), v: amplitud(g), nom: esc(capCorto(CAPS[g])), d: delta(amplitud(g), (b.desdeCaps.get(g)?.size || 0) + (b.desdeActos.get(g)?.size || 0)),
        txt: `${amplitud(g)} partes`, sub: `${c.desdeCaps.get(g)?.size || 0} capítulos · ${c.desdeActos.get(g)?.size || 0} actos · ${c.totalCap.get(g) || 0} citas` })));
  h += tarjeta("Lo más central (cercanía)", "Distancia media, en saltos de cita o modificación, al resto de artículos y actos: lo que la red pone al centro. Entre paréntesis, el puesto en PageRank.",
    [...c.cerca.entries()].sort((x, y) => y[1] - x[1]).slice(0, 15).map(([i, v]) => ({ i, v, nom: nomNodo(i), txt: nfmt(v, 3),
      d: `<small>(PR ${c.rankPR.get(i)})</small>`, sub: `${(TIPOS[N[i].k] || [""])[0]}${N[i].g !== undefined ? " · " : ""}${N[i].g !== undefined ? esc(capCorto(CAPS[N[i].g])) : ""}` })));
  const actos = ACTOS.map((a, k) => k).filter(k => k > 0 && k <= hastaK);
  h += tarjeta("Actos más transversales", "Cuántos capítulos distintos toca cada acto (modifica, ubica o menciona), con el detalle de lo que hace.",
    actos.filter(k => c.actoMods[k].caps.size).sort((x, y) => c.actoMods[y].caps.size - c.actoMods[x].caps.size || c.actoMods[y].mods - c.actoMods[x].mods)
      .map(k => ({ i: nodoActo[k], v: c.actoMods[k].caps.size, txt: `${c.actoMods[k].caps.size} cap.`, nom: esc(ACTOS[k].n),
        sub: `${c.actoMods[k].mods} modificaciones · ${c.actoMods[k].ubica} ubicaciones · ${c.actoMods[k].menc} menciones` })));
  h += tarjeta("Capítulos más modificados", "Versiones de su texto creadas por actos posteriores a las Bases.",
    [...c.capMods.entries()].sort((x, y) => y[1] - x[1]).slice(0, 15).map(([g, v]) => ({ i: capIdx(g), v, nom: esc(capCorto(CAPS[g])) })));
  h += tarjeta("Temas de los actos posteriores", "Fragmentos de actos que no modifican un artículo y quedaron agrupados por tema.",
    c.temas.filter(t => t.v).sort((x, y) => y.v - x.v).map(t => ({ i: t.i, v: t.v, nom: esc(N[t.i].t), sub: `${t.actos} actos`, d: delta(t.v, (b.temas.find(x => x.i === t.i) || {}).v ?? 0) })));
  $("indicadores").innerHTML = h;
  $("indicadores").querySelectorAll(".fila").forEach(bt => bt.addEventListener("click", () => {
    const i = +bt.dataset.i; if (!(i >= 0)) return;
    if (!visibleTipo[N[i].k]) { visibleTipo[N[i].k] = true; filtros(); }

}

// ---------- puntero: zoom, arrastre, pellizco, clic ----------
const punteros = new Map();
let arrastre = null, pellizco = null, movido = false;
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  punteros.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  movido = false;
  if (punteros.size === 2) {
    const [a, b] = [...punteros.values()];
    pellizco = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: vista.s, cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 };
    arrastre = null; return;
  }
  const i = nodoEn(ev.offsetX, ev.offsetY);

  cv.classList.add("arrastra");
});
cv.addEventListener("pointermove", ev => {
  if (punteros.has(ev.pointerId)) punteros.set(ev.pointerId, [ev.offsetX, ev.offsetY]);
  if (pellizco && punteros.size === 2) {
    const [a, b] = [...punteros.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomEn(pellizco.cx, pellizco.cy, pellizco.s * d / pellizco.d);

  }

    sucio = true; return;
  }
  const i = nodoEn(ev.offsetX, ev.offsetY);
  if (i !== hover) { hover = i; sucio = true; cv.classList.toggle("sobre", i >= 0); }
  const p = $("punta");
  if (i >= 0 && ev.pointerType === "mouse") {
    const n = N[i];
    p.innerHTML = `<b>${esc(n.l)}</b> ${esc(n.t === n.l ? "" : n.t)}<span>${esc((TIPOS[n.k] || [n.k])[0])}${n.a !== undefined ? " · " + esc((ACTOS[n.a] || {}).c) : ""} · ${ady[i].length} conexiones</span>`;
    p.hidden = false;
    const x = Math.min(ev.offsetX + 14, W - 290), y = Math.min(ev.offsetY + 14, H - 60);
    p.style.left = x + "px"; p.style.top = y + "px";
  } else p.hidden = true;
});
function soltar(ev) {
  punteros.delete(ev.pointerId);
  if (punteros.size < 2) pellizco = null;
  if (arrastre && !movido) {
    const i = nodoEn(ev.offsetX, ev.offsetY);
    if (i >= 0) seleccionar(i);
    else if (sel >= 0 || resalte) { sel = -1; resalte = null; capResaltado = -1; marcarLeyenda(); $("f-acto").value = ""; ficha(); sucio = true; }
  }

cv.addEventListener("pointerup", soltar);
cv.addEventListener("pointercancel", soltar);
cv.addEventListener("pointerleave", () => { $("punta").hidden = true; if (hover >= 0) { hover = -1; sucio = true; } });

function zoomEn(px, py, s) {
  s = Math.min(60, Math.max(.3, s));

$("subtitulo").textContent = D.concesion.nombre;
$("cifras").textContent = `${N.length.toLocaleString("es-CL")} nodos · ${E.length.toLocaleString("es-CL")} relaciones · ${ACTOS.length} actos`;
leerPaleta(); medir(); encuadrar(todos());
filtros(); leyenda(); selectorActos(); ficha();
const m = /^#n(\d+)$/.exec(location.hash);
if (m && N[+m[1]]) { seleccionar(+m[1]); centrar(+m[1]); }
new ResizeObserver(() => { const s = vista.s; medir(); if (sel < 0 && !resalte) encuadrar(todos()); else sucio = true; }).observe($("lienzo"));
